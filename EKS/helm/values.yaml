image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent

# Registry credentials, as a list of existing Secret names in the release
# namespace. Needed for private registries in other accounts, or for any
# registry that is not the cluster's own ECR -- the EKS node role already
# grants pull access to same-account ECR via
# AmazonEC2ContainerRegistryReadOnly, so this stays empty for the setup
# described in the README.
imagePullSecrets: []
# imagePullSecrets:
#   - name: regcred

# End-user monitoring (Instana). Leave null to disable.
eum:
  key: null
  url: https://eum-eu-west-1.instana.io
  #url: https://eum-us-west-2.instana.io

# web Service type when nodeport is false.
# ClusterIP is correct for EKS: ingress.yaml provides the public ALB, and a
# LoadBalancer Service here would create a second, internal, unreachable NLB.
web:
  serviceType: ClusterIP

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################

######################################
# Probes
#
# Each readinessProbe below is a Kubernetes probe spec passed through
# verbatim. The paths were read out of the service source, not guessed:
#   cart, catalogue, user   -> @app.get('/health')  in server.js
# Set one to null to disable it.
#
# LIVENESS IS OFF BY DEFAULT, DELIBERATELY.
#
# On a node where memory is the binding constraint, a liveness probe that
# fails under load does not fix the service -- it kills the container and
# the kubelet starts it again, still out of memory. That converts a slow
# service into a restart loop and makes the cluster worse, which is
# exactly what happened during the original build: nodes went NotReady
# under load and the storefront returned 503.
#
# A liveness probe is a statement that the process is wedged and can
# never recover. That is a claim worth making only with measurements, not
# by default. When you do add one, keep the window wide: a liveness probe
# should need roughly a minute of continuous failure before it acts, so
# a GC pause or a slow dependency does not trigger it. Readiness is the
# probe that belongs in front of load.
#
# Templates support livenessProbe on all seven workloads below. Uncomment
# the block under a service to enable it. See docs/probes.md.
######################################

######################################
# PodDisruptionBudgets (opt-in, empty by default)
#
# Emits nothing unless this list is set.
#
# Every workload in this chart runs replicas: 1, which makes the obvious
# PDB setting a trap. maxUnavailable: 0 with a single replica means the
# pod can never be evicted, so a node drain waits forever for a pod that
# policy forbids moving. That is not theoretical: during this build,
# eksctl refused to drain a node for exactly that reason and the cluster
# delete needed --drain=false.
#
# Use maxUnavailable: 1 until you have actually scaled a workload above
# one replica:
#
#   podDisruptionBudgets:
#     - workload: web
#       maxUnavailable: 1
#     - workload: cart
#       maxUnavailable: 1
#
# minAvailable and maxUnavailable are mutually exclusive; setting both is
# rejected by the API server, so the chart only emits whichever you give.
######################################

######################################
# Pod spreading (opt-in, empty by default)
#
# This is the fix for the failure described in docs/troubleshooting.md
# issue 8: the scheduler stacked mysql (200Mi) and rabbitmq (256Mi) onto
# the same node, that node reached 99% memory, kubelet stopped posting
# status, and the node went NotReady. Adding more nodes raises the
# ceiling but does not stop the stacking.
#
# Off by default because it changes scheduling for anyone who upgrades.
# To enable, give a service a list of constraints. The example below is
# the one that would have prevented the outage, applied to the three
# heaviest services. Note ScheduleAnyway rather than DoNotSchedule: with
# ScheduleAnyway the scheduler still places a pod when the spread cannot
# be satisfied, so this can never wedge a deployment. DoNotSchedule would
# leave pods Pending, which on a small node count is worse than the
# problem being solved.
#
#   mysql:
#     topologySpreadConstraints:
#       - maxSkew: 1
#         topologyKey: kubernetes.io/hostname
#         whenUnsatisfiable: ScheduleAnyway
#         labelSelector:
#           matchLabels:
#             service: mysql
######################################

######################################
# Pod anti-affinity (opt-in, nothing set by default)
#
# Merged into spec.template.spec.affinity as podAntiAffinity, so it
# composes with an existing affinity value rather than replacing it.
#
# topologySpreadConstraints and antiAffinity are different tools.
# Spread constraints redistribute; anti-affinity refuses. Prefer spread
# constraints for the memory problem in docs/troubleshooting.md issue 8,
# because they degrade gracefully with ScheduleAnyway. Use anti-affinity
# when you specifically want a replica not to land near a named service:
#
#   mysql:
#     antiAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 100
#           podAffinityTerm:
#             topologyKey: kubernetes.io/hostname
#             labelSelector:
#               matchLabels:
#                 service: mysql
#
# preferred is the right form here. requiredDuringScheduling
# would make a second replica unschedulable on a single-node cluster,
# which is a trap rather than a policy.
######################################

cart:
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    # Node.js needs a moment to bind before it answers.
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # livenessProbe:
  #   httpGet:
  #     path: /health
  #     port: 8080
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   failureThreshold: 6      # ~60s of continuous failure before restart

catalogue:
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # livenessProbe:
  #   httpGet:
  #     path: /health
  #     port: 8080
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   failureThreshold: 6

user:
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # livenessProbe:
  #   httpGet:
  #     path: /health
  #     port: 8080
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   failureThreshold: 6

dispatch: {}
# dispatch deliberately has no probe, and there is no value to uncomment.
# It is a pure RabbitMQ consumer: main.go has no net.Listen, no
# ListenAndServe and no HTTP handler, so there is no port to probe. An HTTP
# or tcpSocket probe against it would fail forever.
#
# It also does not need one. The process either holds a channel to RabbitMQ or
# it has exited, and a container that exits is restarted by the kubelet without
# any probe. The "is it working" question is answered by RabbitMQ's own probe
# and by whether dispatch is consuming, not by a synthetic check.
#
# Related: dispatch-service.yaml is a headless Service with targetPort: 0,
# which routes nowhere. It is upstream scaffolding with no consumers in this
# chart. Left in place rather than deleted, since removing a Service can break
# a DNS name something else depends on.

mongodb:
  # mongod exposes no HTTP endpoint, so this is an exec probe. The command was
  # checked against the mongo:5 image this builds from: it exits 0 against a
  # live server and 1 when nothing is listening, so it is a real signal.
  readinessProbe:
    exec:
      command:
        - mongo
        - --quiet
        - --eval
        - db.adminCommand({ping:1}).ok
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 12


  # livenessProbe:
  #   exec:
  #     command: ["mongo", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   failureThreshold: 6

mysql:
  # mysqld also has no HTTP endpoint. This probe exists for one reason: the
  # image runs its init scripts on first boot and takes around 15s before it
  # accepts connections, so without it dependent services race it and log
  # connection errors before recovering.
  #
  # These credentials must match MYSQL_USER and MYSQL_PASSWORD in
  # mysql/Dockerfile, which is where they are defined. They are restated here
  # only so the probe can authenticate. A real deployment should read them
  # from a Secret and mount it as an env var instead -- see docs/probes.md.
  readinessProbe:
    exec:
      command:
        - mysqladmin
        - ping
        - -h
        - "127.0.0.1"
        - -u
        - shipping
        - -psecret
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 300Mi


  # livenessProbe:
  #   exec:
  #     command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "shipping", "-psecret"]
  #   initialDelaySeconds: 60
  #   periodSeconds: 15
  #   failureThreshold: 6

payment:
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com

rabbitmq: {}
# Opt-in probe for rabbitmq, same reasoning as redis. Verified against
# rabbitmq:3.7-management-alpine -- prints "Ping succeeded", exit 0.
# Note the startup cost: the broker needs roughly 10s before it answers.
# Uncomment and move under rabbitmq: to enable.
#   readinessProbe:
#     exec:
#       command: ["rabbitmq-diagnostics", "-q", "ping"]
#     initialDelaySeconds: 15
#     periodSeconds: 10
#     failureThreshold: 6


ratings:
  readinessProbe:
    httpGet:
      path: /_health
      port: 80
    # PHP/Apache. 30 failures at 5s is a generous 150s window, which is what
    # upstream used -- it matters because this probe also gates on MySQL
    # being reachable, and MySQL takes a while to run its init scripts.
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1


  # livenessProbe:
  #   httpGet:
  #     path: /_health
  #     port: 80
  #   initialDelaySeconds: 60
  #   periodSeconds: 15
  #   failureThreshold: 8

redis:
  # Storage class to use with redis statefulset.
  storageClassName: gp2
  # Opt-in. Not enabled by default: redis has no dependents that gate on it,
  # and an extra exec every 5s is pure overhead on a small node.
  # Verified against redis:4.0.6 -- prints PONG, exit 0.
  # readinessProbe:
  #   exec:
  #     command: ["redis-cli", "ping"]
  #   initialDelaySeconds: 5
  #   periodSeconds: 5
  #   failureThreshold: 6

shipping:
  resources:
    requests:
      cpu: 100m
      memory: 150Mi
    limits:
      cpu: 200m
      memory: 300Mi
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    # Spring Boot. Generous window for the same reason as ratings: the
    # service needs MySQL, and a slow first connection should not mark the
    # pod unready.
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1


######################################
# Data-tier images
#
# These two are upstream third-party images, not built from this repo, so
# they do not use image.repo. They are here rather than hardcoded in the
# templates so they can still be mirrored into a private registry, which
# matters for clusters that cannot reach Docker Hub.
######################################

  # livenessProbe:
  #   httpGet:
  #     path: /health
  #     port: 8080
  #   initialDelaySeconds: 60
  #   periodSeconds: 15
  #   failureThreshold: 8

dataTier:
  image:
    redis:
      repo: redis
      tag: "4.0.6"
    rabbitmq:
      repo: rabbitmq
      tag: "3.7-management-alpine"
